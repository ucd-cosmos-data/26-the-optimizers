baseURL: https://ucd-cosmos-data.github.io/26-the-optimizers/
locale: en-us
defaultContentLanguage: en
title: "The Optimizers"
theme: "mana"

pagination:
  pageSize: 10

outputs:
  home:
    - HTML
    - JSON

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  enableIntegrity: false
  relatedPostsCount: 3
  description: "COSMOS data science project site for The Optimizers."
  author: "The Optimizers"
  heroTitleLine1: "The Optimizers"
  heroTitleLine2: "COSMOS Data Science"
  footerText: "Built with Hugo and Mana theme"
  favicon: "bonsai.jpeg"
  math: true
  avatar:
    url: "/26-the-optimizers/bonsai.jpeg"
    home:
      url: "/26-the-optimizers/bonsai.jpeg"
    about:
      url: "/26-the-optimizers/bonsai.jpeg"
  social:
    github: "https://github.com/ucd-cosmos-data/26-the-optimizers"
  buyMeACoffee:
    enabled: false
  codeHighlight:
    darkTheme: catppuccin-macchiato
    lightTheme: catppuccin-frappe
  copyright:
    startYear: 2026
    owner: "The Optimizers"
  admonitions:
    alertStyle: favicon

menus:
  main:
    - identifier: Home
      name: Home
      pageRef: /
      weight: 5
    - identifier: Members
      name: Members
      pageRef: /members/
      weight: 10
    - identifier: Project
      name: Project
      pageRef: /project/
      weight: 20
    - identifier: Logs
      name: Logs
      pageRef: /logs/
      weight: 30
    - identifier: Photos
      name: Photos
      pageRef: /photos/
      weight: 40
    - identifier: course-site
      name: Course Website
      url: https://ucd-cosmos-data.github.io/

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 6
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
    extensions:
      passthrough:
        delimiters:
          block:
          - - $$
            - $$
        enable: true
  highlight:
    codeFences: true
    guessSyntax: true
    noClasses: false
    style: catppuccin-macchiato
